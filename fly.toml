# Wildcrown on Fly.io (see docs/architecture/deploy.md). One machine in
# São Paulo: matches and rooms live in its memory, so it must not scale to two.

app = "wildcrown"
primary_region = "gru"

[env]
  PORT = "8080"
  STATIC_DIR = "/app/dist"
  # Players per team in the public queue
  PLAYERS_PER_TEAM = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when nobody's connected (cheaper), wakes on the next visit
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
